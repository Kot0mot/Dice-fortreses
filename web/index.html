<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dice Fortresses Web MVP</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <main class="layout">
            <section class="panel">
                <h2>Status</h2>
                <div id="status"></div>
                <div id="run-controls"></div>
                <input id="load-run-input" type="file" accept="application/json,.json" hidden />
            </section>

            <section class="panel">
                <h2>Roll / Reroll</h2>
                <div id="roll-panel"></div>
            </section>

            <section class="panel">
                <h2>Slots</h2>
                <div id="slots-panel"></div>
            </section>

            <section class="panel">
                <h2>Build</h2>
                <div id="build-panel"></div>
            </section>

            <section class="panel">
                <h2>Arm</h2>
                <div id="arm-panel"></div>
            </section>

            <section class="panel board-panel">
                <h2>Field</h2>
                <div id="board-legend" class="board-legend"></div>
                <div id="board" class="board"></div>
            </section>

            <section class="panel log-panel">
                <h2>Turn Log</h2>
                <div id="log-controls"></div>
                <div id="log-list" class="log-list"></div>
            </section>
        </main>
        <script type="module" src="./app.ts"></script>
    </body>
</html>
